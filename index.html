<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAPPIST-1 Explorer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="TRAPPIST-1 exploration game"></canvas>
      <section id="hud" aria-live="polite">
        <h1>TRAPPIST-1 EXPLORER</h1>
        <p id="status">SHIP IN ORBIT</p>
        <p id="location"></p>
        <p id="telemetry"></p>
        <p id="help">Flight: WASD / ↑↓ &nbsp;·&nbsp; Land: L &nbsp;·&nbsp; Scan: Space</p>
      </section>
      <div id="message" role="status"></div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
